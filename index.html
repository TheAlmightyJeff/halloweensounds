<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spooky Soundboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #ff7518; }
        button { background: #ff7518; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #e06010; }
        button.secondary { background: #333; }
        button.secondary:hover { background: #444; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sound-card { background: #181818; padding: 10px; border-radius: 6px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }
        .sound-card button { padding: 8px; font-size: 14px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff7518; }
        .flex { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Ambient Panel -->
    <div class="panel">
        <h2>Haunted Ambient</h2>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div class="flex">
                <button id="ambientBtn" onclick="toggleAmbient()">Play Ambient</button>
                <button class="secondary" onclick="stopAmbient()">Stop</button>
            </div>
            <div>
                <label style="font-size: 12px; color: #aaa;">Volume</label>
                <input type="range" min="0" max="1" step="0.01" value="0.7" oninput="setAmbientVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- Soundboard Panel -->
    <div class="panel">
        <h2>Sound Effects</h2>
        <div class="grid" id="soundGrid">
            <!-- Populated via JS -->
        </div>
    </div>
</div>

<script>
    const sounds = [
        { name: "Air Hiss", file: "sounds/air hiss.wav" },
        { name: "Loud Knock", file: "sounds/loud knock ambient.wav" },
        { name: "Minecraft Cave", file: "sounds/minecraft cave sound.mp3" },
        { name: "Metal Knock", file: "sounds/quiet metal knock.wav" },
        { name: "Wood Knock", file: "sounds/quiet wood knock.mp3" },
        { name: "Intense knock", file: "sounds/konkonse.mp3" },
        { name: "Weird ahh scream", file: "sounds/monster-scream-aggressive.mp3" }
        
    ];

    let ambientGain = null, ambientSource = null, ambientAudioCtx = null, isAmbientPlaying = false;
    const soundNodes = {};

    // Audio Context & Gain Node Helper to prevent clicks (smooth ramping)
    function getAudioContext() {
        if (!window.audioCtx) {
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (window.audioCtx.state === 'suspended') {
            window.audioCtx.resume();
        }
        return window.audioCtx;
    }

    // --- Ambient Audio Setup (Seamless looping buffer with smooth gain) ---
    let ambientBuffer = null;
    async function loadAmbient() {
        if (ambientBuffer) return;
        try {
            const ctx = getAudioContext();
            const res = await fetch('sounds/ambient.mp3');
            const arrayBuffer = await res.arrayBuffer();
            ambientBuffer = await ctx.decodeAudioData(arrayBuffer);
        } catch(e) {
            console.error("Ambient load failed, check file path:", e);
        }
    }

    async function toggleAmbient() {
        if (isAmbientPlaying) {
            stopAmbient();
        } else {
            await loadAmbient();
            if (!ambientBuffer) return;
            const ctx = getAudioContext();
            
            ambientSource = ctx.createBufferSource();
            ambientSource.buffer = ambientBuffer;
            ambientSource.loop = true;

            ambientGain = ctx.createGain();
            const sliderVal = document.querySelector('.panel input[type=range]').value;
            ambientGain.gain.setValueAtTime(0, ctx.currentTime);
            ambientGain.gain.linearRampToValueAtTime(parseFloat(sliderVal), ctx.currentTime + 0.1); // Smooth ramp to avoid clicks

            ambientSource.connect(ambientGain);
            ambientGain.connect(ctx.destination);
            
            ambientSource.start(0);
            isAmbientPlaying = true;
            document.getElementById('ambientBtn').textContent = 'Pause Ambient';
        }
    }

    function stopAmbient() {
        if (!isAmbientPlaying || !ambientSource) return;
        const ctx = getAudioContext();
        if (ambientGain) {
            ambientGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
        }
        setTimeout(() => {
            try { ambientSource.stop(); } catch(e){}
            isAmbientPlaying = false;
            document.getElementById('ambientBtn').textContent = 'Play Ambient';
        }, 100);
    }

    function setAmbientVolume(val) {
        if (ambientGain && isAmbientPlaying) {
            const ctx = getAudioContext();
            ambientGain.gain.linearRampToValueAtTime(parseFloat(val), ctx.currentTime + 0.05);
        }
    }

    // --- Sound Effects Setup ---
    const soundBuffers = {};
    async function loadSoundBuffer(file, callback) {
        if (soundBuffers[file]) {
            callback(soundBuffers[file]);
            return;
        }
        try {
            const ctx = getAudioContext();
            const res = await fetch(file);
            const arrayBuffer = await res.arrayBuffer();
            const buffer = await ctx.decodeAudioData(arrayBuffer);
            soundBuffers[file] = buffer;
            callback(buffer);
        } catch(e) {
            console.error("Failed to load sound:", file);
        }
    }

    function playSound(file, volume) {
        const ctx = getAudioContext();
        loadSoundBuffer(file, (buffer) => {
            // Stop previous instance of this exact sound if playing
            if (soundNodes[file]) {
                try { soundNodes[file].gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05); } catch(e){}
            }

            const source = ctx.createBufferSource();
            source.buffer = buffer;

            const gainNode = ctx.createGain();
            gainNode.gain.setValueAtTime(parseFloat(volume), ctx.currentTime);

            source.connect(gainNode);
            gainNode.connect(ctx.destination);

            source.start(0);
            soundNodes[file] = { source, gainNode };
        });
    }

    function updateSoundVolume(file, volume) {
        if (soundNodes[file] && soundNodes[file].gainNode) {
            const ctx = getAudioContext();
            soundNodes[file].gainNode.gain.linearRampToValueAtTime(parseFloat(volume), ctx.currentTime + 0.05);
        }
    }

    // Render sound grid
    const grid = document.getElementById('soundGrid');
    sounds.forEach(snd => {
        const div = document.createElement('div');
        div.className = 'sound-card';
        div.innerHTML = `
            <button onclick="playSound('${snd.file}', document.getElementById('vol_${sanitize(snd.name)}').value)">${snd.name}</button>
            <input id="vol_${sanitize(snd.name)}" type="range" min="0" max="1" step="0.01" value="0.8" oninput="updateSoundVolume('${snd.file}', this.value)">
        `;
        grid.appendChild(div);
    });

    function sanitize(str) {
        return str.replace(/[^a-zA-Z0-9]/g, '_');
    }
</script>

</body>
</html>
